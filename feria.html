<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Inventario Feria — PinandPon 3D</title>
<link rel="icon" type="image/png" href="img/Logo oficial PNG.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>document.write('<link rel="stylesheet" href="css/styles.css?v='+Date.now()+'">');</script>
<!-- Firebase SDK — únicamente Auth y Firestore; esta página no carga
     Chart.js, SheetJS ni Google Identity Services porque no los necesita -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<style>
  /* Pantalla optimizada para celular: todo grande y de un solo dedo */
  body{-webkit-tap-highlight-color:transparent}
  #fe-loading{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--text2);font-size:.95rem;text-align:center;padding:24px}
  #fe-loading svg{animation:fe-spin 1s linear infinite}
  @keyframes fe-spin{to{transform:rotate(360deg)}}
  #fe-fatal{display:none;max-width:440px;margin:60px auto;padding:0 20px;text-align:center}
  #fe-app{max-width:560px;margin:0 auto;padding:16px 14px 60px}
  .fe-hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
  .fe-hdr-title{font-size:1.5rem;font-weight:800;color:var(--text)}
  .fe-hdr-sub{font-size:.8rem;color:var(--text2);margin-top:2px;line-height:1.4}
  .fe-hdr-actions{display:flex;gap:8px;flex-wrap:wrap}
  .fe-hdr-actions .btn{padding:12px 14px;font-size:.85rem;border-radius:12px}
  .fe-hdr-actions .btn-icon-only{padding:12px}
  .fe-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
  .fe-stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 8px;text-align:center}
  .fe-stat-label{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--text3);margin-bottom:4px;line-height:1.2}
  .fe-stat-val{font-size:1.3rem;font-weight:800;color:var(--text);font-family:var(--mono)}
  .fe-stat-val.warn{color:var(--warn)}
  .fe-stat-val.accent{color:var(--accent)}
  .fe-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 2px 12px rgba(15,42,69,.06)}
  .fe-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:16px}
  .fe-card-nombre{font-size:1.25rem;font-weight:800;color:var(--text);line-height:1.2}
  .fe-card-precio{font-size:1rem;color:var(--text2);margin-top:3px;font-family:var(--mono)}
  .fe-card-restantes{text-align:right;flex-shrink:0}
  .fe-card-restantes-label{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--text3)}
  .fe-card-restantes-val{font-size:1.6rem;font-weight:800;color:var(--text)}
  .fe-stepper{display:flex;align-items:center;justify-content:center;gap:22px;margin:10px 0}
  .fe-stepper-btn{
    width:64px;height:64px;border-radius:50%;border:none;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:transform .1s ease,opacity .15s ease;
    background:var(--accent-soft);color:var(--accent);
  }
  .fe-stepper-btn svg{width:26px;height:26px}
  .fe-stepper-btn.minus{background:var(--danger-soft);color:var(--danger)}
  .fe-stepper-btn:active{transform:scale(.9)}
  .fe-stepper-btn:disabled{opacity:.3;cursor:not-allowed}
  .fe-stepper-num{font-size:2.4rem;font-weight:800;min-width:64px;text-align:center;color:var(--text);font-family:var(--mono)}
  .fe-card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
  .fe-card-foot-label{font-size:.78rem;color:var(--text3)}
  .fe-card-foot-val{font-size:.85rem;font-weight:700;color:var(--text2)}
  .fe-remove-btn{background:transparent;border:none;color:var(--text3);padding:10px;cursor:pointer;border-radius:10px}
  .fe-remove-btn:active{background:var(--danger-soft);color:var(--danger)}
  @media (max-width:400px){
    .fe-stepper{gap:14px}
    .fe-stepper-btn{width:58px;height:58px}
    .fe-stepper-num{font-size:2.1rem;min-width:56px}
  }
</style>
</head>
<body>

<div id="toast-container"></div>

<!-- Pantalla de carga mientras se conecta (sin formulario de login) -->
<div id="fe-loading">
  <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
  <span>Conectando…</span>
</div>

<!-- Error irrecuperable (ej. autenticación anónima no habilitada) -->
<div id="fe-fatal">
  <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:12px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
  <div style="font-weight:700;margin-bottom:8px" id="fe-fatal-title">No se pudo conectar</div>
  <p style="color:var(--text2);font-size:.85rem;line-height:1.5" id="fe-fatal-msg"></p>
</div>

<!-- =====================================================
     CONTENIDO — únicamente Inventario Feria, sin login y
     pensado para usarse con el pulgar en un celular
====================================================== -->
<div id="fe-app" style="display:none">
  <div class="fe-hdr">
    <div>
      <div class="fe-hdr-title">Inventario Feria</div>
      <div class="fe-hdr-sub">Sumá o restá ventas del día. Nada se guarda hasta "Cerrar día".</div>
    </div>
  </div>

  <div class="fe-hdr-actions" style="margin-bottom:16px">
    <button class="theme-toggle btn-icon-only" onclick="toggleTheme()">
      <svg id="theme-icon" viewBox="0 0 24 24" width="17" height="17" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
    <button class="btn btn-secondary" onclick="cargarFeriaStandalone()" style="flex:1">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      <span>Recargar</span>
    </button>
    <button class="btn btn-primary" onclick="cerrarDiaFeriaStandalone()" style="flex:1.4">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      <span>Cerrar día</span>
    </button>
  </div>

  <div class="fe-stats">
    <div class="fe-stat">
      <div class="fe-stat-label">En la Feria</div>
      <div class="fe-stat-val" id="fe-st-asignadas">0</div>
    </div>
    <div class="fe-stat">
      <div class="fe-stat-label">Vendidas hoy</div>
      <div class="fe-stat-val warn" id="fe-st-hoy">0</div>
    </div>
    <div class="fe-stat">
      <div class="fe-stat-label">Total hoy</div>
      <div class="fe-stat-val accent" id="fe-st-total">₡0</div>
    </div>
  </div>

  <div id="fe-list"></div>

  <div id="fe-empty" class="empty-state" style="display:none">
    <svg viewBox="0 0 24 24"><path d="M3 21h18"/><path d="M5 21V10.5L3 9l9-6 9 6-2 1.5V21"/><path d="M9 21v-6a3 3 0 0 1 6 0v6"/></svg>
    <p>Todavía no hay productos asignados a la Feria.<br>
      <span style="font-size:.82rem;color:var(--text3)">Pedile a un administrador que los envíe desde Inventario Productos.</span>
    </p>
  </div>
</div>

<!-- =====================================================
     MODAL: CONFIRMACIÓN
====================================================== -->
<div class="modal-overlay" id="modal-confirm" style="display:none" onclick="if(event.target===this)closeConfirm()">
  <div class="modal" style="max-width:360px;width:100%;text-align:center;padding:28px 24px">
    <div class="confirm-icon">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/>
        <path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>
      </svg>
    </div>
    <div style="font-weight:700;font-size:1.05rem;margin-bottom:8px" id="confirm-title">¿Confirmar?</div>
    <p id="confirm-msg" style="color:var(--text2);font-size:.9rem;margin:0 0 20px;white-space:pre-line;text-align:left"></p>
    <div class="btn-group" style="justify-content:center">
      <button class="btn btn-danger" id="confirm-ok-btn" onclick="confirmAction()" style="padding:12px 20px;font-size:.95rem">Confirmar</button>
      <button class="btn btn-ghost" onclick="closeConfirm()" style="padding:12px 20px;font-size:.95rem">Cancelar</button>
    </div>
  </div>
</div>

<script>
  (function(){
    var v = Date.now();
    // Reutiliza solo lo indispensable del resto de la app: db.js (Firebase +
    // helpers de Inventario Feria), logic.js (el/fmt/set) y ui.js (toast/
    // confirmar/escHtml/tema). No carga app.js ni auth.js — esta página no
    // tiene ninguna otra sección a la que navegar.
    ['js/db.js','js/logic.js','js/ui.js'].forEach(function(s){
      document.write('<script src="'+s+'?v='+v+'"><\/script>');
    });
  })();
</script>
<script>
'use strict';

/* ----------------------------------------------------------
   Acceso sin login: se autentica de forma anónima contra el
   mismo proyecto Firebase, así se cumplen las reglas de
   seguridad (que exigen estar autenticado) sin pedirle
   usuario/contraseña a quien atiende el puesto.
---------------------------------------------------------- */
function mostrarErrorFatal(titulo, msg) {
  el('fe-loading').style.display = 'none';
  el('fe-app').style.display = 'none';
  el('fe-fatal-title').textContent = titulo;
  el('fe-fatal-msg').textContent = msg;
  el('fe-fatal').style.display = 'block';
}

firebase.auth().onAuthStateChanged(user => {
  if (user) {
    el('fe-loading').style.display = 'none';
    el('fe-fatal').style.display = 'none';
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
    applyThemeLabels();
    el('fe-app').style.display = 'block';
    _feriaUnsub = fbSuscribirInventarioFeria(data => {
      const draft = new Map(itemsFeria.map(i => [i.id, i.vendidasHoy || 0]));
      itemsFeria = data.map(item => ({
        ...item,
        vendidasHoy: Math.min(draft.get(item.id) || 0, item.cantidadAsignada || 0)
      }));
      renderFeriaStandalone();
    });
  } else {
    firebase.auth().signInAnonymously().catch(e => {
      console.error('Error de autenticación anónima:', e);
      if (e.code === 'auth/operation-not-allowed') {
        mostrarErrorFatal(
          'Falta habilitar el acceso',
          'El inicio de sesión anónimo no está activado en este proyecto de Firebase. Pedile a un administrador que lo habilite en Firebase Console → Authentication → Sign-in method → Anonymous.'
        );
      } else {
        mostrarErrorFatal('No se pudo conectar', e.message || 'Verificá tu conexión a internet e intentá de nuevo.');
      }
    });
  }
});

/* ----------------------------------------------------------
   Estado — Inventario Feria (solo esta colección; nunca se
   cargan cotizaciones, clientes ni ninguna otra información
   del negocio, salvo el documento puntual que se actualiza
   al cerrar el día)
---------------------------------------------------------- */
let itemsFeria   = [];
let _feriaUnsub  = null;

function cargarFeriaStandalone() { renderFeriaStandalone(); }

function renderFeriaStandalone() {
  const list    = el('fe-list');
  const emptyEl = el('fe-empty');
  if (!list) return;

  const items = itemsFeria.filter(i => (i.cantidadAsignada || 0) > 0 || (i.vendidasHoy || 0) > 0);

  if (!items.length) {
    list.innerHTML = '';
    if (emptyEl) emptyEl.style.display = 'flex';
  } else {
    if (emptyEl) emptyEl.style.display = 'none';

    list.innerHTML = items.map(i => {
      const asignadas   = i.cantidadAsignada || 0;
      const vendidasHoy = i.vendidasHoy || 0;
      const restantes    = Math.max(asignadas - vendidasHoy, 0);
      return `<div class="fe-card">
        <div class="fe-card-top">
          <div>
            <div class="fe-card-nombre">${escHtml(i.pieza || '—')}</div>
            <div class="fe-card-precio">${fmt(i.precioUnitario || 0)}</div>
          </div>
          <div class="fe-card-restantes">
            <div class="fe-card-restantes-label">En la Feria</div>
            <div class="fe-card-restantes-val">${restantes}</div>
          </div>
        </div>
        <div class="fe-stepper">
          <button class="fe-stepper-btn minus" title="Restar una venta" onclick="cambiarVendidasFeriaStandalone('${i.id}',-1)" ${vendidasHoy <= 0 ? 'disabled' : ''}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
          <div class="fe-stepper-num">${vendidasHoy}</div>
          <button class="fe-stepper-btn" title="Sumar una venta" onclick="cambiarVendidasFeriaStandalone('${i.id}',1)" ${vendidasHoy >= asignadas ? 'disabled' : ''}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>
        <div class="fe-card-foot">
          <div><span class="fe-card-foot-label">Vendidas hoy</span> <span class="fe-card-foot-val">${vendidasHoy}</span></div>
          <div><span class="fe-card-foot-label">Histórico</span> <span class="fe-card-foot-val">${i.vendidasTotal || 0}</span></div>
          <button class="fe-remove-btn" title="Quitar de la Feria" onclick="quitarDeFeriaStandalone('${i.id}')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </button>
        </div>
      </div>`;
    }).join('');
  }

  const totalAsignadasStandalone = itemsFeria.reduce((s, i) => s + (i.cantidadAsignada || 0), 0);
  const totalHoyStandalone       = itemsFeria.reduce((s, i) => s + (i.vendidasHoy || 0), 0);
  set('fe-st-asignadas', Math.max(totalAsignadasStandalone - totalHoyStandalone, 0));
  set('fe-st-hoy',       totalHoyStandalone);
  set('fe-st-total',     fmt(itemsFeria.reduce((s, i) => s + (i.vendidasHoy || 0) * (i.precioUnitario || 0), 0)));
}

/** Ajusta el conteo LOCAL de "vendidas hoy" — no toca Firestore ni el
 *  inventario real; eso ocurre recién al "Cerrar día". */
function cambiarVendidasFeriaStandalone(feriaId, delta) {
  const idx = itemsFeria.findIndex(i => i.id === feriaId);
  if (idx < 0) return;
  const item  = itemsFeria[idx];
  const nuevo = Math.max(0, Math.min((item.vendidasHoy || 0) + delta, item.cantidadAsignada || 0));
  if (nuevo === item.vendidasHoy) return;
  item.vendidasHoy = nuevo;
  renderFeriaStandalone();
}

function quitarDeFeriaStandalone(feriaId) {
  const item = itemsFeria.find(i => i.id === feriaId);
  if (!item) return;
  if ((item.vendidasHoy || 0) > 0) {
    toast('Cierre el día antes de quitar este producto (tiene ventas sin cerrar)', 'error');
    return;
  }
  showConfirm('Quitar de la Feria', `¿Quitar "${item.pieza}" de la Feria? Las unidades quedan libres en el inventario.`, async () => {
    try {
      await fbEliminarItemFeria(feriaId);
      toast('Producto quitado de la Feria ✓', 'success');
    } catch(e) {
      console.error('Error al quitar de la Feria:', e);
      toast('No se pudo quitar el producto de la Feria', 'error');
    }
  }, 'Quitar');
}

/** "Cerrar día": aplica las ventas locales al inventario real. Solo toca,
 *  uno por uno, el documento puntual de cada producto vendido — nunca
 *  carga ni lee el resto de las cotizaciones del negocio. */
function cerrarDiaFeriaStandalone() {
  const pendientes = itemsFeria.filter(i => (i.vendidasHoy || 0) > 0);
  if (!pendientes.length) { toast('No hay ventas del día para cerrar', 'info'); return; }

  const totalUnidades = pendientes.reduce((s, i) => s + i.vendidasHoy, 0);
  const totalMonto     = pendientes.reduce((s, i) => s + i.vendidasHoy * (i.precioUnitario || 0), 0);

  showConfirm(
    'Cerrar día de Feria',
    `Se aplicarán ${totalUnidades} unidad${totalUnidades !== 1 ? 'es' : ''} vendida${totalUnidades !== 1 ? 's' : ''} (${fmt(totalMonto)}) al inventario real. Esta acción no se puede deshacer.`,
    () => _ejecutarCierreDiaFeriaStandalone(pendientes),
    'Cerrar día'
  );
}

async function _ejecutarCierreDiaFeriaStandalone(pendientes) {
  let ok = 0, fallidos = 0;
  for (const item of pendientes) {
    const cantidad = item.vendidasHoy;
    try {
      const snap = await db.collection('cotizaciones').doc(String(item.trabajoId)).get();
      if (!snap.exists) { fallidos++; continue; }
      const t = snap.data();

      const vendidasPrev   = t.unidadesVendidas || 0;
      const totalUnidades  = Math.max((t.cantidad || 1) * Math.max(t.placas || 1, 1), 1);
      const nuevasVendidas = vendidasPrev + cantidad;
      const ahoraAgotado   = nuevasVendidas >= totalUnidades;
      const entrada = { fecha: new Date().toISOString(), cantidad, nota: 'Venta en Feria' };

      const updateData = {
        unidadesVendidas: firebase.firestore.FieldValue.increment(cantidad),
        historialVentas:  firebase.firestore.FieldValue.arrayUnion(entrada)
      };
      if (ahoraAgotado) {
        Object.assign(updateData, {
          estado: 'Entregado', estadoPago: 'Pagado',
          montoAbonado: t.precio_final || 0, montoPendiente: 0,
          fechaActualizacionEstado: new Date().toISOString()
        });
      }
      await db.collection('cotizaciones').doc(String(item.trabajoId)).update(updateData);

      const feriaItem = {
        ...item,
        cantidadAsignada: Math.max(0, (item.cantidadAsignada || 0) - cantidad),
        vendidasTotal:    (item.vendidasTotal || 0) + cantidad,
        vendidasHoy:      0,
        fechaUltimoCierre: new Date().toISOString()
      };
      await fbGuardarItemFeria(feriaItem);
      const idx = itemsFeria.findIndex(i => i.id === item.id);
      if (idx >= 0) itemsFeria[idx] = feriaItem;
      ok++;
    } catch(e) {
      console.error('Error al cerrar día de Feria para', item.pieza, e);
      fallidos++;
    }
  }

  renderFeriaStandalone();
  if (fallidos === 0) toast(`Día cerrado ✓ (${ok} producto${ok !== 1 ? 's' : ''} actualizado${ok !== 1 ? 's' : ''})`, 'success');
  else toast(`Día cerrado con errores: ${ok} ok, ${fallidos} fallidos — reintente los pendientes`, 'error');
}
</script>
</body>
</html>
